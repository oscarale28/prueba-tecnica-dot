<p-timeline [value]="etapas">
    <ng-template #marker let-event>
        <span class="flex w-8 h-8 items-center justify-center rounded-full z-10 shadow-sm"
            [style]="{
                'background-color': proyectoService.getEtapaStatusColor(event.estado),
                'color': proyectoService.getEtapaStatusTextColor(event.estado)
            }">
            {{ event.orden }}
        </span>
    </ng-template>
    <ng-template pTemplate="content" let-etapa>
        <div class="flex flex-col gap-2 mb-6">
            <p-tag [value]="etapa.estado" [style]="{
                'background-color': proyectoService.getEtapaStatusColor(etapa.estado),
                'color': proyectoService.getEtapaStatusTextColor(etapa.estado)
            }" />
            <div class="flex items-center justify-between">
                <span class="font-semibold">{{ etapa.nombre }}</span>
            </div>
            <div class="text-sm">Inicio: {{ etapa.fechaInicio | date: 'dd/MM/yyyy' }}</div>
            <div class="text-sm">Fin estimado: {{ etapa.fechaFinEstimada | date: 'dd/MM/yyyy' }}</div>
            <div class="text-sm">Presupuesto asignado: {{ etapa.presupuestoAsignado | number: '1.0-0' }}</div>
        </div>
    </ng-template>
</p-timeline>
