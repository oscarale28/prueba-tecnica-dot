services:
  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dot-prueba-tecnica
      - POSTGRES_USER=postgres
    ports:
      - 5432:5432
    networks:
      - dot-net

  api-quarkus:
    container_name: api-quarkus
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    networks:
      - dot-net
    depends_on:
      - postgres
    environment:
      - QUARKUS_DATASOURCE_KIND=postgresql
      - QUARKUS_DATASOURCE_VERSION=17
      - QUARKUS_DATASOURCE_DEVSERVICES_ENABLED=false
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/dot-prueba-tecnica
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=postgres

  frontend:
    container_name: frontend
    image: prueba-tecnica-dot-oscar-orellana-frontend
    build:
      context: ./frontend/
      dockerfile: ./Dockerfile
    ports:
      - 4200:8080
    networks:
      - dot-net
    depends_on:      
      - api-quarkus
    environment:      
      - API_URL=http://localhost:8080
      - PORT=4200

networks:
  dot-net:
    driver: bridge